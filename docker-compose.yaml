services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: splitly
      POSTGRES_PASSWORD: splitly
      POSTGRES_DB: splitly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql

volumes:
  pgdata:
